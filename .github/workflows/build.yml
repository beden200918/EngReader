name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          SDKM=$(find "$SDK" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager=$SDKM"
          test -n "$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译词库
        run: python3 tools/build_dict.py

      - name: 检查词库文件
        run: ls -lh app/src/main/assets/dictionary.db

      - name: 编译 APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 深度检查
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk

          echo "===== 1. 清单里的 hasCode ====="
          AAPT=$(find "$ANDROID_HOME" -name aapt2 -type f | head -n 1)
          echo "aapt2=$AAPT"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | head -60
          else
            echo "没找到 aapt2"
          fi

          echo "===== 2. 编译出的 class 文件 ====="
          MAIN=$(find app/build -name "MainActivity.class" | head -n 1)
          echo "MainActivity.class: ${MAIN:-没找到}"
          echo "class 总数：$(find app/build -name '*.class' | wc -l)"

          echo "===== 3. dex 里的类名 ====="
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          for f in /tmp/dex/*.dex; do
            echo "--- $f ($(stat -c%s $f) bytes) ---"
            strings "$f" | grep "Lcom/example/engreader" | sort -u | head -20
          done

      - name: 重命名
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EngReader-${{ github.run_number }}.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: EngReader-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/EngReader-${{ github.run_number }}.apk
