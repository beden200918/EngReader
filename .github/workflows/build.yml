name: Build APK
permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          SDKM=$(find "$SDK" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager=$SDKM"
          test -n "$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 准备固定签名
        run: |
          mkdir -p signing
          if [ ! -f signing/keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore signing/keystore.jks \
              -storepass engreader123 \
              -keypass engreader123 \
              -alias engreader \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=EngReader, OU=Personal, O=EngReader, L=Unknown, ST=Unknown, C=CN"
          fi
          ls -lh signing

      - name: 保存签名文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f signing/keystore.jks
          if git diff --cached --quiet; then
            echo "签名文件已在仓库中"
          else
            git commit -m "chore: 添加固定签名文件"
            git push origin HEAD:main
          fi

      - name: 编译词库
        run: python3 tools/build_dict.py

      - name: 检查词库文件
        run: ls -lh app/src/main/assets/dictionary.db

      - name: 编译 APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 验证签名与入口
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "===== 签名指纹 ====="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" || true
          echo "===== 入口类检查 ====="
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          if cat /tmp/dex/classes*.dex | strings | grep -q "MainActivity"; then
            echo "✅ 包含 MainActivity"
          else
            echo "❌ 不包含 MainActivity"
            exit 1
          fi

      - name: 重命名
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EngReader-${{ github.run_number }}.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: EngReader-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/EngReader-${{ github.run_number }}.apk
